<div class="filter-bar">
    <button
        class="btn{% if current_days == 7 %} active{% endif %}"
        hx-get="{{ filter_url | default('/dashboard') }}?days=7"
        hx-target="#dashboard-content"
        hx-swap="innerHTML"
    >7d</button>
    <button
        class="btn{% if current_days == 30 %} active{% endif %}"
        hx-get="{{ filter_url | default('/dashboard') }}?days=30"
        hx-target="#dashboard-content"
        hx-swap="innerHTML"
    >30d</button>
    <button
        class="btn{% if current_days == 90 %} active{% endif %}"
        hx-get="{{ filter_url | default('/dashboard') }}?days=90"
        hx-target="#dashboard-content"
        hx-swap="innerHTML"
    >90d</button>
</div>
