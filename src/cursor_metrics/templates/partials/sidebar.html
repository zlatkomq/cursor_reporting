<aside class="layout-sidebar">
    <div class="sidebar-brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <span class="brand-text">Cursor Metrics</span>
    </div>

    <nav class="sidebar-nav">
        <a href="/dashboard" class="nav-link{% if request.url.path.startswith('/dashboard') and request.url.path != '/dashboard/logout' %} active{% endif %}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"/>
                <rect x="14" y="3" width="7" height="7"/>
                <rect x="3" y="14" width="7" height="7"/>
                <rect x="14" y="14" width="7" height="7"/>
            </svg>
            <span class="nav-label">Dashboard</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <a href="/dashboard/logout" class="nav-link nav-logout">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span class="nav-label">Logout</span>
        </a>
    </div>

    <style>
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 24px 20px 20px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-primary);
        }
        .sidebar-nav {
            flex: 1;
            padding: 8px 12px;
            overflow-y: auto;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 6px;
            border-left: 3px solid transparent;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
        }
        .nav-link:hover {
            color: var(--text-primary);
            background: var(--bg-card-hover);
        }
        .nav-link.active {
            color: var(--text-primary);
            background: var(--bg-card-hover);
            border-left-color: var(--accent-blue);
        }
        .nav-link.active svg { stroke: var(--accent-blue); }
        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--border-color);
        }
        .nav-logout { border-left: none; }
        .nav-logout:hover { color: var(--accent-amber); }
    </style>
</aside>
