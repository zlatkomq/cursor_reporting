<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cursor Metrics{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    {% block head %}{% endblock %}
    <style>
        :root {
            /* Figma design tokens (spec 005) */
            --color-black: #000000;
            --color-cyan: #00b8db;
            --color-green: #00c950;
            --color-green-bright: #05df72;
            --color-bg-primary: #0a0a0a;
            --color-bg-active: #171717;
            --color-border: #262626;
            --color-blue: #2b7fff;
            --color-blue-light: #51a2ff;
            --color-purple: #8b5cf6;
            --color-text-secondary: #a1a1a1;
            --color-purple-funnel: #ad46ff;
            --color-amber: #f0b100;
            --color-surface: #fafafa;
            --color-amber-light: #fdc700;
            --color-red: #ff6467;
            --color-white: #ffffff;

            /* Semantic aliases (mapped from Figma tokens) */
            --bg-primary: var(--color-bg-primary);
            --bg-card: var(--color-bg-active);
            --bg-card-hover: #1f1f1f;
            --border-color: var(--color-border);
            --text-primary: var(--color-white);
            --text-secondary: var(--color-text-secondary);
            --text-muted: #737373;
            --accent-blue: var(--color-blue);
            --accent-green: var(--color-green);
            --accent-amber: var(--color-amber);
            --accent-purple: var(--color-purple);
            --sidebar-width: 240px;
            --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-heading: 'Arimo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-stack);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
        }

        .layout-sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .layout-main {
            margin-left: var(--sidebar-width);
            flex: 1;
            min-height: 100vh;
            padding: 32px 40px;
        }

        /* -- Cards -- */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 24px;
            transition: background 0.15s ease;
        }
        .card:hover { background: var(--bg-card-hover); }

        .stat-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card .label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .stat-card .value {
            font-family: var(--font-heading);
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .stat-card .trend {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }
        .stat-card .trend.up { color: var(--accent-green); }
        .stat-card .trend.down { color: var(--accent-amber); }

        /* -- Tables -- */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            text-align: left;
            padding: 12px 16px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-color);
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }
        tr:hover td { background: var(--bg-card-hover); }
        tr:last-child td { border-bottom: none; }

        /* -- Buttons -- */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 13px;
            font-family: var(--font-stack);
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        .btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--text-muted);
        }
        .btn-active, .btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #fff;
        }
        .btn-active:hover, .btn.active:hover {
            background: #2563eb;
            border-color: #2563eb;
        }

        /* -- Form Inputs -- */
        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            font-family: var(--font-stack);
            outline: none;
            transition: border-color 0.15s ease;
        }
        input:focus, select:focus {
            border-color: var(--accent-blue);
        }

        /* -- Chart container -- */
        .chart-container {
            position: relative;
            width: 100%;
            padding: 24px;
        }

        /* -- Page header -- */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }
        .page-header h1 {
            font-family: var(--font-heading);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        /* -- Utility -- */
        .text-secondary { color: var(--text-secondary); }
        .text-muted { color: var(--text-muted); }
        .text-green { color: var(--accent-green); }
        .text-amber { color: var(--accent-amber); }
        .text-blue { color: var(--accent-blue); }

        /* -- Date filter bar -- */
        .filter-bar {
            display: flex;
            gap: 8px;
        }

        /* -- Responsive: collapse sidebar -- */
        @media (max-width: 1024px) {
            .layout-sidebar { width: 60px; overflow: hidden; }
            .layout-sidebar .brand-text,
            .layout-sidebar .nav-label,
            .layout-sidebar .nav-section-label { display: none; }
            .layout-main { margin-left: 60px; }
        }
    </style>
</head>
<body>
    {% include "partials/sidebar.html" %}
    <main class="layout-main">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
