{% extends "base.html" %}

{% block title %}Dashboard — Cursor Metrics{% endblock %}

{% block head %}
<style>
    .tab-bar {
        display: flex;
        gap: 8px;
        margin-bottom: 28px;
        padding: 0;
    }

    .tab {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 20px;
        background: var(--border-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: var(--text-secondary);
        font-family: var(--font-stack);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s ease;
        white-space: nowrap;
    }

    .tab:hover {
        color: var(--text-primary);
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.15);
    }

    .tab.active {
        color: var(--color-bg-active, #171717);
        background: var(--color-surface, #fafafa);
        border-color: var(--color-surface, #fafafa);
    }

    .tab.active:hover {
        background: var(--color-surface, #fafafa);
    }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Dashboard</h1>
</div>

<div class="tab-bar" id="tab-bar">
    <button class="tab {% if active_tab == 'overview' %}active{% endif %}"
            hx-get="/dashboard/overview"
            hx-target="#tab-content"
            hx-push-url="/dashboard?tab=overview"
            onclick="document.querySelectorAll('#tab-bar .tab').forEach(t=>t.classList.remove('active'));this.classList.add('active')">
        Overview
    </button>
    <button class="tab {% if active_tab == 'funnel' %}active{% endif %}"
            hx-get="/dashboard/funnel"
            hx-target="#tab-content"
            hx-push-url="/dashboard?tab=funnel"
            onclick="document.querySelectorAll('#tab-bar .tab').forEach(t=>t.classList.remove('active'));this.classList.add('active')">
        Workflow Funnel
    </button>
    <button class="tab {% if active_tab == 'developers' %}active{% endif %}"
            hx-get="/dashboard/developers"
            hx-target="#tab-content"
            hx-push-url="/dashboard?tab=developers"
            onclick="document.querySelectorAll('#tab-bar .tab').forEach(t=>t.classList.remove('active'));this.classList.add('active')">
        By Developer
    </button>
</div>

<div id="tab-content">
    {% include tab_template %}
</div>
{% endblock %}
