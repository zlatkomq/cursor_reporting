[project]
name = "cursor-metrics"
version = "0.1.0"
description = "Internal metrics collection API for Cursor IDE telemetry"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.115",
    "uvicorn[standard]~=0.32",
    "sqlalchemy[asyncio]~=2.0",
    "aiomysql~=0.2",
    "pydantic-settings~=2.0",
    "alembic~=1.14",
    "jinja2~=3.1",
    "structlog~=24.0",
]

[dependency-groups]
dev = [
    "pytest~=8.0",
    "pytest-asyncio~=0.24",
    "httpx~=0.27",
    "ruff~=0.8",
    "mypy~=1.13",
    "pyyaml~=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["cursor_metrics"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
